<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">FixtureFolio: Webhook payloads, ready for the next regression.</title>
  <desc id="desc">A local-first workflow: bring JSON, inspect changes and redactions, then export reviewable test fixtures. An illustrative workflow graphic, not an application screenshot.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d8ded7"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="#f7f8f2"/>
  <rect width="1280" height="480" rx="24" fill="url(#grid)"/>
  <rect x="40" y="42" width="46" height="46" rx="13" fill="#183c31"/>
  <path d="M53 55h19v6H59v5h11v6H59v7h-6z" fill="#d1f494"/>
  <text x="101" y="73" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#183c31">FixtureFolio</text>
  <rect x="1051" y="48" width="184" height="34" rx="17" fill="#e3ecdf"/>
  <text x="1143" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#365346">LOCAL-FIRST · MIT</text>
  <text x="48" y="148" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.7" fill="#183c31">Webhook payloads,</text>
  <text x="48" y="201" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.7" fill="#183c31">ready for the next regression.</text>
  <text x="50" y="240" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57695f">See what changed. Review what leaves. Keep the fixture.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="288" width="364" height="131" rx="16" fill="#fff" stroke="#d5ddd2"/>
    <text x="70" y="321" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b7c6f">01 / BRING JSON</text>
    <text x="70" y="353" font-size="21" font-weight="700" fill="#183c31">Paste, upload, or explore</text>
    <text x="70" y="382" font-size="15" fill="#657367">Start with synthetic provider samples.</text>
    <path d="M420 353h18m-7-7 7 7-7 7" fill="none" stroke="#709264" stroke-width="2"/>
    <rect x="449" y="288" width="364" height="131" rx="16" fill="#183c31"/>
    <text x="471" y="321" font-size="12" font-weight="700" letter-spacing="1.5" fill="#badd9e">02 / INSPECT</text>
    <text x="471" y="353" font-size="21" font-weight="700" fill="#fff">Diff paths. Review redactions.</text>
    <text x="471" y="382" font-size="15" fill="#d3dfd4">Every match has a path and a reason.</text>
    <path d="M821 353h18m-7-7 7 7-7 7" fill="none" stroke="#709264" stroke-width="2"/>
    <rect x="850" y="288" width="382" height="131" rx="16" fill="#e1edce" stroke="#cbd9ba"/>
    <text x="872" y="321" font-size="12" font-weight="700" letter-spacing="1.5" fill="#587348">03 / KEEP THE FIXTURE</text>
    <text x="872" y="353" font-size="21" font-weight="700" fill="#183c31">Export JSON + a manifest</text>
    <text x="872" y="382" font-size="15" fill="#576c4b">Review the result before committing it.</text>
    <text x="49" y="454" font-size="12" letter-spacing=".5" fill="#768176">ILLUSTRATIVE WORKFLOW · RULE-BASED REDACTION REQUIRES HUMAN REVIEW</text>
  </g>
</svg>
